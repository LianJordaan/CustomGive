name: build

on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test every Minecraft target
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --console=plain
      - name: Check deployable JAR metadata
        run: python tools/check_artifacts.py
      - name: Upload deployable JARs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: customgive-development-jars
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar
          if-no-files-found: error
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: customgive-test-reports-${{ matrix.os }}
          path: versions/*/build/reports/tests/
