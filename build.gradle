plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

ext.versionMatrix = new groovy.json.JsonSlurper().parse(file('versions.json'))

configure(subprojects.findAll { rootProject.versionMatrix.containsKey(it.name) }) {
    apply plugin: 'java'
    def target = rootProject.versionMatrix[project.name]
    apply plugin: target.yarn == null ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

    version = rootProject.mod_version
    group = rootProject.maven_group
    base.archivesName = "CustomGive-fabric-${target.minecraft}"

    sourceSets.main.java.setSrcDirs([
        rootProject.file('src/main/java'),
        rootProject.file("src/${target.source}/java")
    ])
    sourceSets.main.resources.setSrcDirs([rootProject.file('src/main/resources')])
    sourceSets.test.java.setSrcDirs([
        rootProject.file('src/test/java'),
        rootProject.file("src/${target.source}Test/java")
    ])

    dependencies {
        minecraft "com.mojang:minecraft:${target.minecraft}"
        if (target.yarn != null) {
            mappings "net.fabricmc:yarn:${target.yarn}:v2"
            modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        } else {
            implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        }
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
        testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.fabric_loader_version}"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    processResources {
        inputs.property 'version', project.version
        inputs.property 'minecraft_version', target.minecraft
        inputs.property 'java_version', target.java
        filesMatching('fabric.mod.json') {
            expand(version: project.version, minecraft_version: target.minecraft,
                   java_version: target.java)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = target.java
    }
    java {
        sourceCompatibility = JavaVersion.toVersion(target.java)
        targetCompatibility = JavaVersion.toVersion(target.java)
    }
    test.useJUnitPlatform()
    jar.from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
