plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

ext.versionMatrix = new groovy.json.JsonSlurper().parse(file('versions.json'))

configure(subprojects.findAll { rootProject.versionMatrix.containsKey(it.name) }) {
    apply plugin: 'java'
    def target = rootProject.versionMatrix[project.name]
    apply plugin: target.yarn == null ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

    version = rootProject.mod_version
    group = rootProject.maven_group
    base.archivesName = "CustomGive-fabric-${target.minecraft}"

    sourceSets.main.java.setSrcDirs([
        rootProject.file('src/main/java'),
        rootProject.file("src/${target.source}/java")
    ])
    sourceSets.main.resources.setSrcDirs([rootProject.file('src/main/resources')])
    sourceSets.test.java.setSrcDirs([
        rootProject.file('src/test/java'),
        rootProject.file("src/${target.source}Test/java")
    ])

    dependencies {
        minecraft "com.mojang:minecraft:${target.minecraft}"
        if (target.yarn != null) {
            mappings "net.fabricmc:yarn:${target.yarn}:v2"
            modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        } else {
            implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        }
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
        testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.fabric_loader_version}"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    processResources {
        inputs.property 'version', project.version
        inputs.property 'minecraft_version', target.minecraft
        inputs.property 'java_version', target.java
        filesMatching('fabric.mod.json') {
            expand(version: project.version, minecraft_version: target.minecraft,
                   java_version: target.java)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = target.java
    }
    java {
        sourceCompatibility = JavaVersion.toVersion(target.java)
        targetCompatibility = JavaVersion.toVersion(target.java)
    }
    test.useJUnitPlatform()
    jar.from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }

    if (project.hasProperty('customgiveLiveTest')) {
        def tickLiveTest = target.source in ['legacy', 'componentsLegacy']
        fabricApi {
            configureTests {
                createSourceSet = true
                modId = 'customgive-live-test'
                enableGameTests = false
                enableClientGameTests = !tickLiveTest
            }
        }
        def liveSources = [rootProject.file(
                target.source == 'legacy' ? 'src/legacyLiveTest/java' :
                target.source == 'componentsLegacy' ? 'src/componentsLegacyLiveTest/java' :
                target.yarn != null ? 'src/yarnGameTest/java' : 'src/mojangGameTest/java')]
        if (tickLiveTest) liveSources.add(rootProject.file('src/liveTestCommon/java'))
        sourceSets.gametest.java.setSrcDirs(liveSources)
        sourceSets.gametest.resources.setSrcDirs([rootProject.file(
                tickLiveTest ? 'src/legacyLiveTest/resources' : 'src/liveTest/resources')])
        dependencies {
            productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
        }
        def liveTestJar = tasks.register('liveTestJar', Jar) {
            from(sourceSets.gametest.output)
            archiveBaseName = 'customgive-private-client-test'
            archiveVersion = '1.0.0'
            archiveClassifier = target.yarn == null ? '' : 'dev'
            destinationDirectory = layout.buildDirectory.dir('private')
        }
        def liveTestRuntimeJar = liveTestJar
        if (target.yarn != null) {
            liveTestRuntimeJar = tasks.register('remapLiveTestJar', net.fabricmc.loom.task.RemapJarTask) {
                dependsOn liveTestJar
                inputFile.set(liveTestJar.flatMap { it.archiveFile })
                archiveBaseName = 'customgive-private-client-test'
                archiveVersion = '1.0.0'
                archiveClassifier = ''
                destinationDirectory = layout.buildDirectory.dir('private')
            }
        }
        tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
            if (!tickLiveTest) {
                jvmArgs.add('-Dfabric.client.gametest')
                jvmArgs.add('-Dfabric.client.gametest.disableNetworkSynchronizer=true')
            }
            jvmArgs.add("-Dcustomgive.test.address=${project.findProperty('customgiveTestAddress') ?: '127.0.0.1:27210'}")
            jvmArgs.add("-Dcustomgive.test.phase=${project.findProperty('customgiveTestPhase') ?: 'creative'}")
            jvmArgs.add("-Dcustomgive.test.expected_sha512=${project.findProperty('customgiveTestJarSha512') ?: ''}")
            jvmArgs.add("-Dcustomgive.test.minecraft=${target.minecraft}")
            programArgs.addAll(['--username', project.findProperty('customgiveTestUsername') ?: 'CgProbe'])
            if (project.name == 'mc26_3') {
                programArgs.addAll(['--graphicsBackend', 'vulkan'])
            }
            runDir = file(project.findProperty('customgiveTestRunDir') ?: 'build/live-client')
            mods.from(liveTestRuntimeJar)
        }
    }
}
